<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jewellery calculator — Rivaayat</title>
  <link rel="icon" href="assets/brand-emblem.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="calculator">
  <div id="site-header"></div>
  <div class="wrap page-hero">
    <p class="eyebrow">Metal + making + GST</p>
    <h1>Price it with a local jeweller</h1>
    <p class="muted">Formula used: (weight × today’s rate) + wastage + making + stone charges + 3% GST on metal + 5% GST on making + hallmark.</p>
  </div>
  <section class="section" style="padding-top:8px">
    <div class="wrap split-2">
      <form class="panel form" id="calc-form">
        <label>Jeweller
          <select id="c-shop"></select>
        </label>
        <label>Purity
          <select id="c-purity">
            <option>22K</option>
            <option>24K</option>
            <option>18K</option>
            <option>Silver</option>
            <option>Platinum</option>
          </select>
        </label>
        <label>Weight (grams)
          <input id="c-weight" type="number" step="0.1" value="10">
        </label>
        <label>Making %
          <input id="c-making" type="number" step="0.1" value="12">
        </label>
        <label>Wastage %
          <input id="c-wastage" type="number" step="0.1" value="2">
        </label>
        <label>Stone / extra charges (₹)
          <input id="c-stone" type="number" value="0">
        </label>
      </form>
      <div class="panel" id="calc-out"></div>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
