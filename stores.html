<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jewellers in Bhopal — Rivaayat</title>
  <link rel="icon" href="assets/brand-emblem.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="stores">
  <div id="site-header"></div>
  <div class="wrap page-hero">
    <p class="eyebrow">New Market · Arera Colony · Kolar · Itwara · MP Nagar</p>
    <h1>Jewellers of Bhopal</h1>
    <p class="muted">Rated local gold, diamond and bridal houses. Open a storefront, call the shop, or run their making charges through the calculator.</p>
  </div>
  <section class="section" style="padding-top:12px">
    <div class="wrap">
      <div class="filter-box filters-row">
        <label>Search<input id="s-q" placeholder="shop, area, specialty"></label>
        <label>Area<select id="s-area"><option value="">All areas</option></select></label>
        <label>Specialty
          <select id="s-spec">
            <option value="">All</option>
            <option>Gold</option>
            <option>Diamond</option>
            <option>Bridal</option>
            <option>Silver</option>
            <option>Polki</option>
            <option>Temple</option>
            <option>Kids</option>
          </select>
        </label>
        <label>Min rating
          <select id="s-rating">
            <option value="0">Any</option>
            <option value="4.5">4.5+</option>
            <option value="4.7">4.7+</option>
            <option value="4.8">4.8+</option>
          </select>
        </label>
      </div>
      <p class="muted" id="stores-meta"></p>
      <div class="shop-grid" id="stores-grid"></div>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
