<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jewellery catalogue — Rivaayat</title>
  <link rel="icon" href="assets/brand-emblem.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="catalogue">
  <div id="site-header"></div>
  <div class="wrap page-hero">
    <p class="eyebrow">Gold · Diamond · Bridal · Silver</p>
    <h1>Catalogue</h1>
    <p class="muted">Filter by metal, shop, weight and occasion. Prices rebuild from today’s Bhopal rate plus each jeweller’s making and GST.</p>
  </div>
  <section class="section" style="padding-top:12px">
    <div class="wrap filters">
      <aside class="filter-box">
        <h3>Filter jewellery</h3>
        <label>Search<input id="f-q" placeholder="haar, nath, solitaire"></label>
        <label>Category
          <select id="f-category">
            <option value="">All</option>
            <option value="gold">Gold</option>
            <option value="diamond">Diamond</option>
            <option value="bridal">Bridal</option>
            <option value="polki">Polki</option>
            <option value="silver">Silver</option>
            <option value="temple">Temple</option>
          </select>
        </label>
        <label>Type
          <select id="f-type">
            <option value="">All</option>
            <option>Necklace</option>
            <option>Earrings</option>
            <option>Bangles</option>
            <option>Rings</option>
            <option>Pendant</option>
            <option>Set</option>
            <option>Nath</option>
            <option>Anklet</option>
            <option>Bracelet</option>
          </select>
        </label>
        <label>Purity
          <select id="f-purity">
            <option value="">All</option>
            <option>18K</option>
            <option>22K</option>
            <option>24K</option>
            <option>Silver</option>
            <option>Platinum</option>
          </select>
        </label>
        <label>Occasion
          <select id="f-occasion">
            <option value="">All</option>
            <option>Daily Wear</option>
            <option>Wedding</option>
            <option>Festive</option>
            <option>Office</option>
            <option>Gift</option>
          </select>
        </label>
        <label>Jeweller
          <select id="f-shop"><option value="">All shops</option></select>
        </label>
        <label>For
          <select id="f-gender">
            <option value="">Anyone</option>
            <option>Women</option>
            <option>Men</option>
            <option>Kids</option>
            <option>Unisex</option>
          </select>
        </label>
        <label>Min price (₹)<input id="f-min" type="number" placeholder="0"></label>
        <label>Max price (₹)<input id="f-max" type="number" placeholder="500000"></label>
        <label>Min grams<input id="f-wmin" type="number" step="0.1"></label>
        <label>Max grams<input id="f-wmax" type="number" step="0.1"></label>
        <label><input id="f-best" type="checkbox"> Bestsellers only</label>
        <label>Sort
          <select id="f-sort">
            <option value="featured">Featured</option>
            <option value="best">Bestsellers</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="weight">Heaviest first</option>
          </select>
        </label>
      </aside>
      <div>
        <p class="muted" id="result-meta"></p>
        <div class="prod-grid" id="catalogue-grid"></div>
      </div>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
